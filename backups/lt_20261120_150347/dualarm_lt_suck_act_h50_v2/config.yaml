datasets:
  vla_data:
    action_mode: abs
    data_mix: dualarm_lt_suck_v2_h50
    data_root_dir: /root/data/datasets
    dataset_py: lerobot_datasets
    lerobot_version: v3.0
    load_all_data_for_training: true
    num_workers: 8
    obs_image_size:
    - 224
    - 224
    per_device_batch_size: 16
    pin_memory: true
    video_backend: pyav
    video_cache_dir: /root/data1/starvla/dualarm_lt_suck_224_mmap
framework:
  action_dim: 11
  chunk_size: 50
  image_keys:
  - left_side
  - left_wrist
  - right_wrist
  - right_side
  image_size:
  - 224
  - 224
  n_obs_steps: 1
  name: ACT
  pretrained_backbone_weights: ResNet18_Weights.IMAGENET1K_V1
  state_dim: 24
output_dir: /root/data/outputs/starVLA/dualarm_lt_suck_act_h50_v2/dualarm_lt_suck_act_h50_v2
run_id: dualarm_lt_suck_act_h50_v2
run_root_dir: /root/data/outputs/starVLA/dualarm_lt_suck_act_h50_v2
seed: 42
trainer:
  eval_interval: 1000
  freeze_modules: ''
  gradient_clipping: 1.0
  learning_rate:
    action_model: 0.0001
    base: 0.0001
  logging_frequency: 10
  lr_scheduler_type: cosine_with_min_lr
  max_train_steps: 80000
  num_warmup_steps: 5000
  optimizer:
    betas:
    - 0.9
    - 0.95
    eps: 1.0e-08
    weight_decay: 1.0e-08
  pretrained_checkpoint: null
  save_format: pt
  save_interval: 10000
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
