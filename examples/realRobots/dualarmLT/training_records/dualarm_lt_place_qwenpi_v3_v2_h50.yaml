run_id: dualarm_lt_place_qwenpi_v3_v2_h50
run_root_dir: /root/data/outputs/starVLA/dualarm_lt_place_qwenpi_v3_v2_h50
seed: 42
wandb_entity: null
wandb_project: dualarm_lt_place_qwenpi_v3_v2_h50
is_debug: false
version_id: '0.21'
framework:
  name: QwenPI_v3
  qwenvl:
    base_vlm: /root/data/models/Qwen3-VL-4B-Instruct-Action
    attn_implementation: sdpa
    vl_hidden_dim: 2560
    num_vl_layers: 36
  action_model:
    action_model_type: LayerwiseFM
    action_dim: 11
    state_dim: 24
    action_horizon: 50
    repeated_diffusion_steps: 2
    num_inference_timesteps: 4
    add_pos_embed: true
    max_seq_len: 1024
    num_target_vision_tokens: 32
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    diffusion_model_cfg:
      action_dit_hidden_dim: 1024
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      positional_embeddings: null
      attention_head_dim: 64
      num_layers: 36
      input_embedding_dim: 1024
      cross_attention_dim: 1024
      num_attention_heads: 16
    future_action_window_size: 49
    past_action_window_size: 0
datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: true
    data_root_dir: /root/data/datasets
    data_mix: dualarm_lt_place_v2_h50_2cam
    action_mode: abs
    lerobot_version: v3.0
    per_device_batch_size: 8
    load_all_data_for_training: true
    video_cache_dir: /root/data/cache/starvla/place_lt_v2_224_mmap
    obs_image_size:
    - 224
    - 224
    video_backend: pyav
    num_workers: 4
    pin_memory: false
trainer:
  pretrained_checkpoint: /root/data/models/VLAct_Qwen3_Pretrain/checkpoints/steps_100000_pytorch_model.pt
  random_init_action_model: true
  reset_steps: true
  is_resume: false
  repeated_diffusion_steps: 2
  max_train_steps: 20000
  num_warmup_steps: 500
  save_interval: 5000
  eval_interval: 1000
  learning_rate:
    base: 1.0e-05
    qwen_vl_interface: 1.0e-05
    action_model: 0.0001
    project_layers: 0.0001
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 5.0e-07
  freeze_modules: ''
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  gradient_checkpointing: true
  save_format: pt
  optimizer:
    name: AdamW
    betas:
    - 0.9
    - 0.95
    eps: 1.0e-08
    weight_decay: 1.0e-08
config_yaml: /root/data/starVLA/examples/realRobots/dualarmLTPlace/train_files/qwenpi_v3_place_v2_h50.yaml
output_dir: /root/data/outputs/starVLA/dualarm_lt_place_qwenpi_v3_v2_h50/dualarm_lt_place_qwenpi_v3_v2_h50
