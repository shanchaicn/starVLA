run_id: dualarm_lt_snap_act_h50_v2
run_root_dir: /root/data/outputs/starVLA/dualarm_lt_snap_act_h50_v2
seed: 42
wandb_entity: null
wandb_project: dualarm_lt_snap_act_h50_v2
is_debug: false
version_id: '0.21'
framework:
  name: ACT
  chunk_size: 50
  action_dim: 11
  state_dim: 24
  n_obs_steps: 1
  image_keys:
  - left_wrist
  - right_side
  image_size:
  - 224
  - 224
  pretrained_backbone_weights: ResNet18_Weights.IMAGENET1K_V1
datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: true
    data_root_dir: /root/data/datasets
    data_mix: dualarm_lt_snap_v2_h50_2cam
    action_mode: abs
    lerobot_version: v3.0
    per_device_batch_size: 2
    load_all_data_for_training: true
    video_cache_dir: /root/data/cache/starvla/snap_lt_v2_224_mmap
    obs_image_size:
    - 224
    - 224
    video_backend: pyav
    num_workers: 8
    pin_memory: true
trainer:
  pretrained_checkpoint: /root/data/outputs/starVLA/dualarm_lt_snap_act_h50_v2/dualarm_lt_snap_act_h50_v2/checkpoints/steps_20000_pytorch_model.pt
  max_train_steps: 50000
  num_warmup_steps: 5000
  save_interval: 10000
  eval_interval: 1000
  learning_rate:
    base: 0.0001
    action_model: 0.0001
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: ''
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  gradient_checkpointing: false
  save_format: pt
  optimizer:
    name: AdamW
    betas:
    - 0.9
    - 0.95
    eps: 1.0e-08
    weight_decay: 1.0e-08
  is_resume: true
  reset_steps: false
  random_init_action_model: false

