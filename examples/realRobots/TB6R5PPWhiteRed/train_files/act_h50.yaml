run_id: pp_white_red_act_h50
run_root_dir: /root/data/outputs/starVLA/pp_white_red_h50
seed: 42
wandb_entity: null
wandb_project: pp_white_red_h50
is_debug: false
version_id: "0.21"

framework:
  name: ACT
  chunk_size: 50
  action_dim: 8
  state_dim: 8
  n_obs_steps: 1
  image_size: [224, 224]
  image_keys: [front, wrist]
  # ImageNet pretraining is recommended; use null only for from-scratch baselines or offline smoke tests.
  pretrained_backbone_weights: "ResNet18_Weights.IMAGENET1K_V1"

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: true
    data_root_dir: /root/data/datasets
    data_mix: pp_white_red_abs8_h50
    action_mode: abs
    lerobot_version: v3.0
    per_device_batch_size: 1
    load_all_data_for_training: true
    obs_image_size: [224, 224]
    video_backend: torchvision_av
    num_workers: 0
    pin_memory: false

trainer:
  pretrained_checkpoint: null
  max_train_steps: 10000
  num_warmup_steps: 500
  save_interval: 1000
  eval_interval: 1000
  learning_rate:
    base: 1.0e-4
    action_model: 1.0e-4
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-6
  freeze_modules: ""
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  gradient_checkpointing: false
  save_format: pt
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-8
    weight_decay: 1.0e-8
