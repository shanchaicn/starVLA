run_id: pp_white_red_qwengroot_h50
run_root_dir: /root/data/outputs/starVLA/pp_white_red_h50
seed: 42
wandb_entity: null
wandb_project: pp_white_red_h50
is_debug: false
version_id: "0.21"

framework:
  name: QwenGR00T
  qwenvl:
    base_vlm: /root/data/models/Qwen3-VL-4B-Instruct-Action
    attn_implementation: sdpa
  action_model:
    action_model_type: DiT-B
    action_hidden_dim: 1024
    hidden_size: 1024
    add_pos_embed: true
    max_seq_len: 1024
    action_dim: 8
    state_dim: 8
    action_horizon: 50
    repeated_diffusion_steps: 2
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 4
    num_target_vision_tokens: 32
    diffusion_model_cfg:
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      num_layers: 16
      output_dim: 1024
      positional_embeddings: null

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: true
    data_root_dir: /root/data/datasets
    data_mix: pp_white_red_abs8_h50
    action_mode: abs
    lerobot_version: v3.0
    per_device_batch_size: 1
    load_all_data_for_training: true
    obs_image_size: [224, 224]
    video_backend: torchvision_av
    num_workers: 0
    pin_memory: false

trainer:
  pretrained_checkpoint: null
  max_train_steps: 20000
  num_warmup_steps: 500
  save_interval: 5000
  eval_interval: 1000
  learning_rate:
    base: 1.0e-5
    qwen_vl_interface: 1.0e-5
    action_model: 1.0e-4
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 5.0e-7
  freeze_modules: ""
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 2
  gradient_checkpointing: true
  save_format: pt
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-8
    weight_decay: 1.0e-8
