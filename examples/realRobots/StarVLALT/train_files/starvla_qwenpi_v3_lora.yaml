run_id: starvlalt_insert_lora
run_root_dir: /root/data/outputs/starVLA/starvla-lt
seed: 42
wandb_entity: null
wandb_project: starvla-lt
is_debug: false
version_id: "0.21"

framework:
  name: QwenPI_v3
  qwenvl:
    base_vlm: /root/data/models/Qwen3-VL-4B-Instruct-Action
    attn_implementation: sdpa
    num_vl_layers: 36
  action_model:
    action_model_type: LayerwiseFM
    action_dim: 14
    state_dim: 14
    action_horizon: 16
    repeated_diffusion_steps: 2
    num_inference_timesteps: 4
    add_pos_embed: true
    max_seq_len: 1024
    num_target_vision_tokens: 32
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    diffusion_model_cfg:
      action_dit_hidden_dim: 1024
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: false
      norm_type: ada_norm
      positional_embeddings: null
      attention_head_dim: 64
  vlm:
    lora:
      enabled: true
      r: 16
      alpha: 32
      dropout: 0.05
      bias: none
      target_modules: [q_proj, k_proj, v_proj, o_proj]
      adapter_path: null
      adapter_name: default
      is_trainable: true
      save_adapter_only: false
      module_path: qwen_vl_interface.model
      adapter_dir_name: vlm_lora_adapter
      task_type: CAUSAL_LM

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: true
    data_root_dir: /root/data/datasets/starvla-lt
    data_mix: starvla_insert
    action_mode: abs
    lerobot_version: v3.0
    image_size: 224
    per_device_batch_size: 1
    video_backend: torchvision_av
    num_workers: 4
    pin_memory: true
    persistent_workers: true

trainer:
  pretrained_checkpoint: /root/data/models/VLAct_Qwen3_Pretrain/checkpoints/steps_100000_pytorch_model.pt
  random_init_action_model: true
  reset_steps: true
  is_resume: false
  max_train_steps: 5
  num_warmup_steps: 1
  save_interval: 5
  eval_interval: 1000
  learning_rate:
    base: 1.0e-4
    qwen_vl_interface: 2.0e-4
    action_model: 1.0e-4
    project_layers: 1.0e-4
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-6
  freeze_modules: qwen_vl_interface
  logging_frequency: 1
  gradient_clipping: 1.0
  gradient_accumulation_steps: 8
  gradient_checkpointing: true
  save_format: pt
  optimizer:
    betas: [0.9, 0.95]
    eps: 1.0e-8
    weight_decay: 1.0e-8
