# All relative paths are relative to this YAML file.
paths:
  models_root: ../models
  source_root: runtime/source
  eval_deps: runtime/eval_deps
  vendor_act: 252_original/vendor_act
  base_vlm: ../models/base/Qwen3-VL-4B-Instruct-Action

runtime:
  # Thor uses shared system/GPU memory. Include reclaimable system memory in
  # the startup check rather than treating page cache as unavailable VRAM.
  unified_memory: true
  min_available_memory_gib: 18
  cuda_visible_devices: "0"
  omp_num_threads: 4

profiles:
  qwenpi_v3_v2:
    script: dualarm_lt_rtc_server_16.py
    model_dir: dualarm_lt_suck_qwenpi_v3_v2_h50
    model_id: dualarm_lt_suck_qwenpi_v3_v2_h50-RTC-DEV
    port: 10199
    checkpoint_size: 10941594936
    state_dim: 24
    action_dim: 11
    action_do_nums: [8, 9, 10, 11]
    camera_order: [left_side, right_wrist, right_side]
    arm: arm_0
    instruction: "Use the suction cup on the robot's right arm to pick up the phone support plate."
