framework:
  name: QwenPI_v3_RGBD
  rgbd:
    encoder: lingbot
    checkpoint: /root/data/models/lingbot-depth-v0.5/model.pt
    num_tokens: 1200
  qwenvl:
    base_vlm: /root/data/models/Qwen3-VL-4B-Instruct
    attn_implementation: sdpa
  action_model:
    state_dim: 8
    action_dim: 7
    action_horizon: 16
    num_inference_timesteps: 10
    diffusion_model_cfg:
      action_dit_hidden_dim: 512
      attention_head_dim: 64
      dropout: 0.0
      final_dropout: false
      interleave_self_attention: false
trainer:
  repeated_diffusion_steps: 1
datasets:
  vla_data:
    obs_image_size: [256, 256]
rgbd_experiment:
  data_root: /root/data/datasets/LIBERO-3D-selected
  selected_tasks: experiments/rgbd/selected_tasks.json
  normalization: experiments/rgbd/normalization.json
  contract: experiments/rgbd/contract.json
